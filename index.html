<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control - Elite Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c0d10; color: #f3f4f6; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .header { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 15px; color: #fff; }
        .connected-badge { background: #064e3b; color: #34d399; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        
        .card { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .card-title { font-size: 13px; font-weight: bold; color: #fbbf24; display: flex; justify-content: space-between; align-items: center; }
        
        /* Live chart mock */
        .chart-box { background: #0c0d10; border-radius: 8px; height: 70px; padding: 8px; display: flex; align-items: flex-end; position: relative; overflow: hidden; border: 1px solid #262b35; }
        .chart-line { width: 100%; height: 2px; background: #fbbf24; position: relative; box-shadow: 0 0 10px #fbbf24; transform: translateY(-20px); }
        
        .checklist { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #9ca3af; }
        .check-item { display: flex; align-items: center; justify-content: space-between; background: #1a1e29; padding: 8px 12px; border-radius: 6px; }
        .dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px #34d399; }
        
        .control-panel { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 16px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; font-weight: bold; }
        .status-indicator { background: #7f1d1d; color: #f87171; padding: 4px 10px; border-radius: 6px; font-size: 11px; }
        .status-indicator.active { background: #064e3b; color: #34d399; }
        
        .btn-group { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; text-align: center; text-decoration: none; font-size: 13px; }
        .btn-start { background: #064e3b; border: 1px solid #34d399; color: #34d399; }
        .btn-stop { background: #7f1d1d; border: 1px solid #f87171; color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h2>MT5 CONTROL</h2>
                <span style="font-size: 10px; color: #9ca3af;">JustMarkets / Exness Bridge</span>
            </div>
            <div class="connected-badge">CONNECTED</div>
        </div>

        <!-- Live Analysis Card -->
        <div class="card">
            <div class="card-title">
                <span>⚡ LIVE ANALYSIS</span>
                <span style="font-size: 10px; color: #9ca3af;">XAUUSD / EURUSD</span>
            </div>
            <div class="chart-box">
                <div class="chart-line"></div>
            </div>
            <div class="checklist">
                <div class="check-item"><span>Detecting market structure</span><div class="dot"></div></div>
                <div class="check-item"><span>Calibrating stop loss & lot</span><div class="dot"></div></div>
                <div class="check-item"><span>AI predictive scoring</span><div class="dot"></div></div>
            </div>
        </div>

        <!-- Bot Control Panel -->
        <div class="control-panel">
            <div class="status-row">
                <span>Bot Status</span>
                <div id="statusBadge" class="status-indicator">STOPPED</div>
            </div>
            <div class="btn-group">
                <a href="https://t.me/JamesAutoTradeBot?text=/start%20DEMO%20XAUUSD" target="_blank" class="action-btn btn-start" onclick="activateBot()">▶ START BOT</a>
                <a href="https://t.me/JamesAutoTradeBot?text=/stop" target="_blank" class="action-btn btn-stop" onclick="stopBot()">⏹ STOP BOT</a>
            </div>
        </div>
    </div>

    <script>
        function activateBot() {
            document.getElementById('statusBadge').innerText = 'RUNNING';
            document.getElementById('statusBadge').classList.add('active');
        }
        function stopBot() {
            document.getElementById('statusBadge').innerText = 'STOPPED';
            document.getElementById('statusBadge').classList.remove('active');
        }
    </script>
</body>
</html>

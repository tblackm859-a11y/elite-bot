<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control - Elite Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c0d10; color: #f3f4f6; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #14171f; border-radius: 12px; border: 1px solid #262b35; }
        .header h2 { font-size: 15px; color: #fff; }
        .btn { display: block; width: 100%; padding: 14px; text-align: center; background: #2563eb; color: #fff; text-decoration: none; font-weight: bold; border-radius: 10px; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .stop-btn { background: #dc2626; }
        .stop-btn:hover { background: #b91c1c; }
        .card { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 16px; }
        h3 { font-size: 14px; color: #9ca3af; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Elite Bot Dashboard</h2>
            <span>Connected</span>
        </div>

        <div class="card">
            <h3>Quick Actions</h3>
            <!-- Trigger Demo XAUUSD Signal -->
            <a href="https://t.me/JamesAutoTradeBot?text=/start%20DEMO%20XAUUSD" target="_blank" class="btn">
                ▶ Start Demo (XAUUSD)
            </a>

            <!-- Trigger Real EURUSD Signal -->
            <a href="https://t.me/JamesAutoTradeBot?text=/start%20REAL%20EURUSD" target="_blank" class="btn">
                ▶ Start Real (EURUSD)
            </a>

            <!-- Stop Bot Command -->
            <a href="https://t.me/JamesAutoTradeBot?text=/stop" target="_blank" class="btn stop-btn">
                🛑 Stop Bot
            </a>
        </div>
    </div>

</body>
    </html>

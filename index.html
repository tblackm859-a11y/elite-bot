<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT5 Control - Elite Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0c0d10;
            color: #d1d5db;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #14171f;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #1f2430;
            margin-bottom: 12px;
        }

        .header h2 {
            font-size: 15px;
            margin: 0;
            color: #ffffff;
        }

        .header span {
            font-size: 11px;
            color: #9ca3af;
        }

        .status-badge-top {
            background: #064e3b;
            color: #34d399;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        .card {
            background: #14171f;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .metric-row span:last-child {
            color: #ffffff;
            font-family: monospace;
        }

        .analysis-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b1f2b;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #ffffff;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #34d399;
        }

        /* Smooth Gold Area Chart matching video */
        .chart-box {
            background: #1b1f2b;
            height: 100px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid #232838;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
        }

        .control-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-start {
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #059669;
        }

        .btn-stop {
            background-color: #7f1d1d;
            color: #f87171;
            border: 1px solid #dc2626;
        }

        .btn:active {
            opacity: 0.8;
        }

        .remove-btn {
            font-size: 11px;
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>MT5 Control</h2>
            <span>ghostraderaal.com</span>
        </div>
        <div>
            <span style="font-size: 16px;">⚙️</span>
        </div>
    </div>

    <div style="margin-bottom: 12px;">
        <span class="status-badge-top">🟢

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT5 Control - Elite Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0f12;
            color: #f3f4f6;
            padding: 14px 12px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Top Bar Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-group h1 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .title-group p {
            font-size: 11px;
            color: #6b7280;
            margin-top: 1px;
        }

        .nav-icons {
            display: flex;
            gap: 12px;
            color: #9ca3af;
        }

        /* Status Banner */
        .status-container {
            margin-bottom: 16px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #10b981;
            letter-spacing: 0.5px;
        }

        .status-pill .dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .broker-text {
            font-size: 11px;
            color: #6b7280;
            margin-left: 8px;
        }

        /* Dark Card Component */
        .card {
            background: #14171d;
            border: 1px solid #1f242d;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .btn-remove {
            color: #ef4444;
            font-size: 11px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Account Details */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
        }

        .info-label {
            color: #9ca3af;
        }

        .info-value {
            color: #ffffff;
            font-weight: 500;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Golden Area Chart */
        .chart-box {
            position: relative;
            width: 100%;
            height: 110px;
            background: #101217;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1a1e27;
            margin-bottom: 14px;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
        }

        /* Market Signals */
        .check-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1e26;
            border: 1px solid #232833;
            padding: 11px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #d1d5db;
        }

        .glow-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .monitor-footer {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            margin-top: 10px;
        }

        /* Positions List (Like Video Trade Tab) */
        .trade-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1f242d;
            font-size: 12px;
        }

        .trade-row:last-child {
            border-bottom: none;
        }

        .trade-symbol {
            font-weight: 700;
            color: #ffffff;
        }

        .trade-type {
            font-size: 11px;
            color: #ef4444; /* red for sell, green for buy */
            margin-left: 4px;
        }

        .trade-profit-pos {
            color: #34d399;
            font-weight: 700;
            font-family: monospace;
        }

        .trade-profit-neg {
            color: #f87171;
            font-weight: 700;
            font-family: monospace;
        }

        /* Controls Section */
        .bot-status-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .status-running {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .status-stopped {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

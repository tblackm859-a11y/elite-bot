<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control - Elite Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c0d10; color: #f3f4f6; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        .top-header { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
        .top-status-row { display: flex; justify-content: space-between; align-items: center; }
        .connected-title { font-size: 15px; font-weight: 900; color: #34d399; letter-spacing: 0.5px; }
        .connected-sub { font-size: 11px; color: #9ca3af; }
        .domain-tag { font-size: 10px; color: #6b7280; }

        .card { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; }
        .mt5-title { font-size: 13px; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 6px; }
        
        .mode-tabs { display: flex; background: #0c0d10; border: 1px solid #262b35; border-radius: 8px; padding: 3px; gap: 4px; margin-bottom: 4px; }
        .mode-tab { flex: 1; background: transparent; border: none; color: #9ca3af; font-size: 11px; font-weight: bold; padding: 6px; border-radius: 6px; cursor: pointer; text-align: center; transition: 0.2s; }
        .mode-tab.active { background: #2563eb; color: #fff; }
        .mode-tab.real.active { background: #dc2626; color: #fff; }

        .account-field { display: flex; flex-direction: column; gap: 3px; }
        .account-field label { font-size: 11px; color: #9ca3af; font-weight: 600; }
        .account-field input { background: #0c0d10; border: 1px solid #374151; border-radius: 8px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; width: 100%; font-weight: 500; transition: border-color 0.2s; }
        .account-field input:focus { border-color: #fbbf24; }

        .live-analysis-title { font-size: 12px; font-weight: 800; color: #34d399; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .chart-box { background: #0c0d10; border-radius: 8px; height: 60px; padding: 8px; display: flex; align-items: center; position: relative; overflow: hidden; border: 1px solid #262b35; }
        .chart-line { width: 100%; height: 2px; background: #fbbf24; position: relative; box-shadow: 0 0 10px #fbbf24; animation: pulseLine 2s infinite alternate; }
        @keyframes pulseLine { 0% { opacity: 0.4; } 100% { opacity: 1; transform: scaleY(1.2); } }

        .checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
        .check-item { display: flex; align-items: center; justify-content: space-between; background: #0c0d10; border: 1px solid #262b35; padding: 9px 12px; border-radius: 8px; font-size: 12px; color: #d1d5db; }
        .dot { width: 7px; height: 7px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .control-panel { background: #14171f; border-radius: 12px; border: 1px solid #262b35; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
        .bot-title { font-size: 13px; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 6px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
        .status-indicator { background: #7f1d1d; color: #f87171; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; transition: 0.3s; }
        .status-indicator.active { background: #064e3b; color: #34d399; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 2px; }
        .action-btn { flex: 1; padding: 12px; border: 1px solid transparent; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 12px; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-start { background: #064e3b; border-color: #34d399; color: #34d399; }
        .btn-stop { background: #7f1d1d; border-color: #f87171; color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-header">
            <div class="top-status-row">
                <span class="connected-title">CONNECTED</span>
                <span class="domain-tag">elite-bot.github.io</span>
            </div>
            <span class="connected-sub" id="topSubText">Connected to JustMarkets (Demo)</span>
        </div>

        <div class="card">
            <div class="card-header-row">
                <div class="mt5-title">🔶 MT5 ACCOUNT</div>
            </div>
            
            <div class="mode-tabs">
                <button id="demoTab" class="mode-tab active" onclick="switchAccount('demo')">DEMO MODE</button>
                <button id="realTab" class="mode-tab real" onclick="switchAccount('real')">REAL MODE</button>
            </div>

            <div class="account-field">
                <label>Broker</label>
                <input type="text" id="brokerInput" value="JustMarkets">
            </div>
            <div class="account-field">
                <label>Login ID</label>
                <input type="text" id="loginInput" value="1200453988">
            </div>
            <div class="account-field">
                <label>Server</label>
                <input type="text" id="serverInput" value="JustMarkets-Demo">
            </div>
            <div class="account-field">
                <label>Account Type</label>
                <input type="text" id="typeInput" value="Demo Account">
            </div>
        </div>

        <div class="card">
            <div class="live-analysis-title">⚡ LIVE ANALYSIS</div>
            <div class="chart-box">
                <div class="chart-line"></div>
            </div>
            <div class="checklist">
                <div class="check-item"><span>Detecting market structure</span><div class="dot"></div></div>
                <div class="check-item"><span>Calibrating stop loss</span><div class="dot"></div></div>
                <div class="check-item"><span>AI scoring</span><div class="dot"></div></div>
            </div>
            <p style="font-size: 10px; color: #9ca3af; text-align: center; margin-top: 2px;" id="monitorText">Elite Bot is monitoring your Demo account</p>
        </div>

        <div class="control-panel">
            <div class="bot-title">🤖 BOT CONTROL</div>
            <div class="status-row">
                <span style="color: #9ca3af; font-size: 12px;">Bot Status</span>
                <div id="statusBadge" class="status-indicator">STOPPED</div>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-start" onclick="startBot()">▶ START BOT</button>
                <button class="action-btn btn-stop" onclick="stopBot()">⏹ STOP BOT</button>
            </div>
        </div>
    </div>

    <script>
        function switchAccount(mode) {
            const demoTab = document.getElementById('demoTab');
            const realTab = document.getElementById('realTab');
            const brokerInput = document.getElementById('brokerInput');
            const loginInput = document.getElementById('loginInput');
            const serverInput = document.getElementById('serverInput');
            const typeInput = document.getElementById('typeInput');
            const topSubText = document.getElementById('topSubText');
            const monitorText = document.getElementById('monitorText');

            if (mode === 'demo') {
                demoTab.classList.add('active');
                realTab.classList.remove('active');
                brokerInput.value = 'JustMarkets';
                loginInput.value = '1200453988';
                serverInput.value = 'JustMarkets-Demo';
                typeInput.value = 'Demo Account';
                topSubText.innerText = 'Connected to JustMarkets (Demo)';
                monitorText.innerText = 'Elite Bot is monitoring your Demo account';
            } else {
                realTab.classList.add('active');
                demoTab.classList.remove('active');
                brokerInput.value = 'JustMarkets';
                loginInput.value = '1550283076';
                serverInput.value = 'JustMarkets-Live';
                typeInput.value = 'Real Live Account';
                topSubText.innerText = 'Connected to JustMarkets (Real)';
                monitorText.innerText = 'Elite Bot is monitoring your Real account';
            }
        }

        function startBot() {
            const badge = document.getElementById('statusBadge');
            badge.innerText = 'RUNNING';
            badge.classList.add('active');

            fetch('http://127.0.0.1:5000/start', { method: 'POST' })
                .catch(err => console.log('Local bridge signal sent'));
        }

        function stopBot() {
            const badge = document.getElementById('statusBadge');
            badge.innerText = 'STOPPED';
            badge.classList.remove('active');

            fetch('http://127.0.0.1:5000/stop', { method: 'POST' })
                .catch(err => console.log('Local bridge stopped'));
    }
</script>
<script src="bot-connector.js"></script>
</body>
</html>

    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Control - Elite Bot</title>
    <style>
        body {
            background-color: #0c0d10;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #14171f;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #1f2430;
            margin-bottom: 12px;
        }
        .header h2 {
            font-size: 15px;
            margin: 0;
            color: #ffffff;
        }
        .header span {
            font-size: 11px;
            color: #9ca3af;
        }
        .status-badge {
            background: #064e3b;
            color: #34d399;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }
        .card {
            background: #14171f;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .metric-row span:last-child {
            color: #ffffff;
            font-family: monospace;
        }
        .analysis-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b1f2b;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
        }
        .chart-placeholder {
            background: #1b1f2b;
            height: 90px;
            border-radius: 8px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #fbbf24;
        }
        .bar {
            width: 8%;
            background: linear-gradient(to top, #d97706, #fbbf24);
            border-radius: 4px 4px 0 0;
        }
        .control-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-start {
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #059669;
        }
        .btn-stop {
            background-color: #7f1d1d;
            color: #f87171;
            border: 1px solid #dc2626;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>MT5 Control</h2>
            <span>ghostraderaal.com</span>
        </div>
        <div>
            <span style="font-size: 16px;">⚙️</span>
        </div>
    </div>

    <div>
        <div class="status-badge">🟢 CONNECTED</div>
        <span style="font-size: 12px; color: #9ca3af; margin-left: 6px;">Connected to Exness</span>
    </div>

    <!-- MT5 ACCOUNT CARD -->
    <div class="card" style="margin-top: 12px;">
        <div class="card-title">
            <span>⚡ MT5 Account</span>
            <span style="font-size: 11px; color: #ef4444; cursor: pointer;">Remove</span>
        </div>
        
        <div class="metric-row"><span>Broker:</span><span>Exness</span></div>
        <div class="metric-row"><span>Login:</span><span>56197382</span></div>
        <div class="metric-row"><span>Server:</span><span>Exness-Real23</span></div>
        <div class="metric-row"><span>Account type:</span><span>Live</span></div>
    </div>

    <!-- LIVE ANALYSIS CARD -->
    <div class="card">
        <div class="card-title">
            <span>📈 Live Analysis</span>
        </div>
        
        <!-- Simulated chart bars matching video vibe -->
        <div class="chart-placeholder">
            <div class="bar" style="height: 30%;"></div>
            <div class="bar" style="height: 45%;"></div>
            <div class="bar" style="height: 40%;"></div>
            <div class="bar" style="height: 65%;"></div>
            <div class="bar" style="height: 55%;"></div>
            <div class="bar" style="height: 80%;"></div>
            <div class="bar" style="height: 70%;"></div>
            <div class="bar" style="height: 95%;"></div>
        </div>

        <div class="analysis-item">
            <span>Detecting market</span>
            <span class="dot"></span>
        </div>
        <div class="analysis-item">
            <span>Calibrating stop loss</span>
            <span class="dot"></span>
        </div>
        <div class="analysis-item">
            <span>AI scoring</span>
            <span class="dot"></span>
        </div>
        <p style="font-size: 11px; color: #9ca3af; margin-top: 8px; text-align: center;">Elite Bot is monitoring your live account</p>
    </div>

    <!-- BOT CONTROL CARD -->
    <div class="card">
        <div class="card-title">
            <span>🤖 Bot Control</span>
            <span id="status-indicator" style="background: #064e3b; color: #34d399; padding: 2px 8px; border-radius: 4px; font-size: 10px;">RUNNING</span>
        </div>
        
        <div class="control-btns">
            <button class="btn btn-start" onclick="setBotStatus('RUNNING')">▶ START BOT</button>
            <button class="btn btn-stop" onclick="setBotStatus('STOPPED')">⏹ STOP BOT</button>
        </div>
    </div>

    <script>
        function setBotStatus(status) {
            const indicator = document.getElementById('status-indicator');
            if (status === 'RUNNING') {
                indicator.style.background = '#064e3b';
                indicator.style.color = '#34d399';
                indicator.innerText = 'RUNNING';
            } else {
                indicator.style.background = '#7f1d1d';
                indicator.style.color = '#f87171';
                indicator.innerText = 'STOPPED';
            }
        }
    </script>

</body>
        </html>
